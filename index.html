<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/notecat.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A minimal, local-first note-taking app" />
    <title>Notecat</title>
    <style>
      #app-loading {
        color-scheme: light dark;

        display: flex;
        align-items: center;
        justify-content: center;

        background-color: #121212;

        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        width: 100vw;

        div.spinner {
          box-sizing: border-box;
          width: 40px;
          height: 40px;
          border: 4px solid #eeeeee;
          border-top-color: #121212;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }

        @media (prefers-color-scheme: light) {
          background-color: #eeeeee;

          div.spinner {
            border-color: #121212;
            border-top-color: #eeeeee;
          }
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loading">
      <div class="spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
