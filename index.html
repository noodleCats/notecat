<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/notecat.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A minimal, local-first note-taking app" />
    <title>Notecat</title>
    <style>
      #app-loading {
        color-scheme: light dark;

        display: flex;
        align-items: center;
        justify-content: center;

        background-color: #121212;

        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        width: 100vw;

        z-index: 1000;

        .loading-container {
          width: 200px;
          height: 4px;
          background-color: #333333;
          border-radius: 2px;
          overflow: hidden;
        }

        .loading-bar {
          height: 100%;
          width: 30%;
          background-color: #eeeeee;
          border-radius: 2px;
          animation: loading 1.5s ease-in-out infinite;
        }

        @media (prefers-color-scheme: light) {
          background-color: #eeeeee;

          .loading-container {
            background-color: #cccccc;
          }

          .loading-bar {
            background-color: #121212;
          }
        }
      }

      @keyframes loading {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(200%);
        }
        100% {
          transform: translateX(400%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loading">
      <div class="loading-container">
        <div class="loading-bar"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
