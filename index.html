<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A minimal, local-first note-taking app" />
    <title>Notecat</title>
    <script>
      // Mirrors resolveTheme() in src/app/state/theme.svelte.ts, so the
      // first paint is already in the right theme
      (() => {
        let preference = null;
        try {
          preference = localStorage.getItem("notecat:theme");
        } catch {}
        const light =
          preference === "light" ||
          (preference !== "dark" &&
            matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
    <style>
      /* Shown before app.css loads; match --color-text/--color-bg there */
      :root {
        --boot-fg: oklch(97% 0 none);
        --boot-track: oklch(37.1% 0 none);
        --boot-bg: oklch(17.5% 0 none);

        color-scheme: dark;
      }

      :root[data-theme="light"] {
        --boot-fg: oklch(20.5% 0 none);
        --boot-track: oklch(87% 0 none);
        --boot-bg: oklch(100% 0 none);

        color-scheme: light;
      }

      .full-view {
        position: fixed;
        inset: 0;
      }

      #app {
        color: var(--color-text, var(--boot-fg));
        background-color: var(--color-bg, var(--boot-bg));
        display: flex;
        flex-direction: column;
      }

      #loading {
        background-color: var(--boot-bg);

        display: flex;
        align-items: center;
        justify-content: center;

        opacity: 0;
        transition: opacity 0.15s;
        z-index: 1000;

        .loading-container {
          width: 200px;
          height: 4px;
          background-color: var(--boot-track);
          border-radius: 2px;
          overflow: hidden;
        }

        .loading-bar {
          height: 100%;
          width: 40%;
          background-color: var(--boot-fg);
          border-radius: 2px;
          animation: loading 1.5s ease-in-out infinite alternate;
        }
      }

      @keyframes loading {
        0% {
          transform: translateX(-200%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="full-view">
      <div class="loading-container">
        <div class="loading-bar"></div>
      </div>
    </div>
    <div id="app" class="full-view"></div>
    <script>
      window.__loadingTimer = setTimeout(() => {
        const loadingScreen = document.querySelector("#loading");
        if (loadingScreen) loadingScreen.style.opacity = "1";
      }, 500);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
