<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A minimal, local-first note-taking app" />
    <title>Notecat</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("notecat:theme") === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <style>
      :root {
        --startup-text: oklch(97% 0 none);
        --startup-border: oklch(37.1% 0 none);
        --startup-bg: oklch(17.5% 0 none);

        color-scheme: dark;
      }

      :root[data-theme="light"] {
        --startup-text: oklch(20.5% 0 none);
        --startup-border: oklch(87% 0 none);
        --startup-bg: white;

        color-scheme: light;
      }

      .full-view {
        position: fixed;
        inset: 0;
      }

      #app {
        color: var(--color-text, var(--startup-text));
        background-color: var(--color-bg, var(--startup-bg));
        display: flex;
        flex-direction: column;
      }

      #loading {
        background-color: var(--color-bg, var(--startup-bg));

        display: flex;
        align-items: center;
        justify-content: center;

        opacity: 0;
        transition: opacity 0.15s;
        z-index: 1000;

        .loading-container {
          width: 200px;
          height: 4px;
          background-color: var(--color-border, var(--startup-border));
          border-radius: 2px;
          overflow: hidden;
        }

        .loading-bar {
          height: 100%;
          width: 40%;
          background-color: var(--color-text, var(--startup-text));
          border-radius: 2px;
          animation: loading 1.5s ease-in-out infinite alternate;
        }
      }

      @keyframes loading {
        0% {
          transform: translateX(-200%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="full-view">
      <div class="loading-container">
        <div class="loading-bar"></div>
      </div>
    </div>
    <div id="app" class="full-view"></div>
    <script>
      window.__loadingTimer = setTimeout(() => {
        const loadingScreen = document.querySelector("#loading");
        if (loadingScreen) loadingScreen.style.opacity = "1";
      }, 500);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
